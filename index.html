<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Approval Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for table container */
        .table-container::-webkit-scrollbar {
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Modal transition */
        .modal-active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Name Input Modal (Used instead of prompt()) -->
    <div id="nameModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center transition-opacity duration-300 z-50 modal-hidden backdrop-blur-sm px-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full transform transition-all">
            <div class="text-center mb-6">
                <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Welcome!</h2>
                <p class="text-gray-500 mt-2">Please enter your name to personalize your tracker.</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="nameInput" placeholder="e.g. Alex Doe" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" autocomplete="off">
                <button id="saveNameBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition-colors shadow-md hover:shadow-lg">
                    Save & Continue
                </button>
            </div>
        </div>
    </div>

    <!-- Main Application UI -->
    <div id="appContainer" class="flex-grow flex flex-col max-w-4xl w-full mx-auto p-4 sm:p-6 lg:p-8 hidden">
        
        <!-- Header -->
        <header class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Daily Tracker</h1>
                <p class="text-gray-500 flex items-center gap-2 mt-1">
                    Good to see you, <span id="displayName" class="font-semibold text-blue-600">User</span>!
                    <button id="editNameBtn" class="text-gray-400 hover:text-blue-600 transition-colors" title="Edit Name">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                        </svg>
                    </button>
                </p>
            </div>
            <div class="text-right">
                <p class="text-sm text-gray-500 font-medium" id="currentDateDisplay">Loading date...</p>
            </div>
        </header>

        <!-- Action Area -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
            <button id="approveBtn" class="group relative overflow-hidden bg-white border-2 border-emerald-500 hover:bg-emerald-50 text-emerald-600 rounded-2xl p-6 flex flex-col items-center justify-center gap-3 transition-all active:scale-95 shadow-sm hover:shadow-md">
                <div class="bg-emerald-100 p-3 rounded-full group-hover:scale-110 transition-transform duration-300">
                    <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <span class="text-xl font-bold">Approve</span>
            </button>
            
            <button id="rejectBtn" class="group relative overflow-hidden bg-white border-2 border-rose-500 hover:bg-rose-50 text-rose-600 rounded-2xl p-6 flex flex-col items-center justify-center gap-3 transition-all active:scale-95 shadow-sm hover:shadow-md">
                <div class="bg-rose-100 p-3 rounded-full group-hover:scale-110 transition-transform duration-300">
                    <svg class="w-8 h-8 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </div>
                <span class="text-xl font-bold">Reject</span>
            </button>
        </div>

        <!-- Table & Export Area -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex-grow flex flex-col">
            <div class="p-6 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                <h2 class="text-lg font-bold text-gray-800">History Log</h2>
                <button id="exportBtn" class="flex items-center gap-2 bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Export to Excel
                </button>
            </div>
            
            <div class="table-container overflow-x-auto p-0 flex-grow">
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-sm uppercase tracking-wider">
                            <th class="py-4 px-6 font-semibold">Date</th>
                            <th class="py-4 px-6 font-semibold text-emerald-600">Approved</th>
                            <th class="py-4 px-6 font-semibold text-rose-600">Rejected</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 text-gray-700">
                        <!-- Rows will be populated by JavaScript -->
                    </tbody>
                </table>
                <div id="emptyState" class="hidden flex-col items-center justify-center p-12 text-gray-400">
                    <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                    <p>No records found. Start approving or rejecting to build your log.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data State
        let userName = localStorage.getItem('trackerUserName') || '';
        // Records structured as: { "YYYY-MM-DD": { approved: 0, rejected: 0 } }
        let records = JSON.parse(localStorage.getItem('trackerRecords')) || {};

        // DOM Elements
        const nameModal = document.getElementById('nameModal');
        const nameInput = document.getElementById('nameInput');
        const saveNameBtn = document.getElementById('saveNameBtn');
        const appContainer = document.getElementById('appContainer');
        const displayName = document.getElementById('displayName');
        const editNameBtn = document.getElementById('editNameBtn');
        const currentDateDisplay = document.getElementById('currentDateDisplay');
        const approveBtn = document.getElementById('approveBtn');
        const rejectBtn = document.getElementById('rejectBtn');
        const tableBody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');
        const exportBtn = document.getElementById('exportBtn');

        // Helper: Format Date to display elegantly
        function getDisplayDate(dateStr) {
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            // Ensure local timezone parsing by appending time
            return new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, options);
        }

        // Helper: Get Current Date in YYYY-MM-DD local timezone format
        function getTodayString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Update UI Display Date
        currentDateDisplay.textContent = new Date().toLocaleDateString(undefined, { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });

        // App Initialization
        function initApp() {
            if (!userName) {
                showModal();
            } else {
                showApp();
            }
            renderTable();
        }

        // Modal Logic
        function showModal() {
            nameInput.value = userName;
            nameModal.classList.remove('modal-hidden');
            nameModal.classList.add('modal-active');
            nameInput.focus();
            appContainer.classList.add('hidden');
        }

        function hideModal() {
            nameModal.classList.remove('modal-active');
            nameModal.classList.add('modal-hidden');
        }

        function showApp() {
            hideModal();
            displayName.textContent = userName;
            appContainer.classList.remove('hidden');
            appContainer.classList.add('flex');
        }

        // Save Name Action
        function saveName() {
            const inputVal = nameInput.value.trim();
            if (inputVal) {
                userName = inputVal;
                localStorage.setItem('trackerUserName', userName);
                showApp();
            }
        }

        saveNameBtn.addEventListener('click', saveName);
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveName();
        });
        editNameBtn.addEventListener('click', showModal);


        // Core Logic: Add Action (Approve/Reject)
        function handleAction(type) {
            const today = getTodayString();

            // Initialize today's record if it doesn't exist
            if (!records[today]) {
                records[today] = { approved: 0, rejected: 0 };
            }

            // Increment specific counter
            if (type === 'approve') {
                records[today].approved++;
            } else if (type === 'reject') {
                records[today].rejected++;
            }

            // Persist and Render
            localStorage.setItem('trackerRecords', JSON.stringify(records));
            renderTable();
            
            // Visual feedback on row
            highlightTodayRow(today);
        }

        approveBtn.addEventListener('click', () => handleAction('approve'));
        rejectBtn.addEventListener('click', () => handleAction('reject'));


        // Render Table Data
        function renderTable() {
            tableBody.innerHTML = '';
            const dates = Object.keys(records).sort((a, b) => new Date(b) - new Date(a)); // Sort descending

            if (dates.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                dates.forEach(date => {
                    const data = records[date];
                    const isToday = date === getTodayString();
                    
                    const tr = document.createElement('tr');
                    tr.id = `row-${date}`;
                    tr.className = `transition-colors duration-300 hover:bg-gray-50 ${isToday ? 'bg-blue-50/30' : ''}`;
                    
                    tr.innerHTML = `
                        <td class="py-4 px-6 font-medium ${isToday ? 'text-blue-700' : 'text-gray-800'}">
                            ${getDisplayDate(date)} ${isToday ? '<span class="ml-2 text-xs bg-blue-100 text-blue-700 py-1 px-2 rounded-full">Today</span>' : ''}
                        </td>
                        <td class="py-4 px-6 font-bold text-emerald-600 bg-emerald-50/10">${data.approved}</td>
                        <td class="py-4 px-6 font-bold text-rose-600 bg-rose-50/10">${data.rejected}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            }
        }

        // Briefly highlight the row that was just updated
        function highlightTodayRow(date) {
            const row = document.getElementById(`row-${date}`);
            if (row) {
                row.classList.add('bg-blue-100');
                setTimeout(() => {
                    row.classList.remove('bg-blue-100');
                }, 500);
            }
        }

        // Export to Excel (CSV format)
        function exportToCSV() {
            const dates = Object.keys(records).sort((a, b) => new Date(b) - new Date(a));
            
            if (dates.length === 0) return; // Nothing to export

            let csvContent = "Date,Approved,Rejected\n";

            dates.forEach(date => {
                const row = [date, records[date].approved, records[date].rejected];
                csvContent += row.join(",") + "\n";
            });

            // Create Blob and Download Link
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            
            link.setAttribute("href", url);
            link.setAttribute("download", `tracking_data_${getTodayString()}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        exportBtn.addEventListener('click', exportToCSV);

        // Start Application
        initApp();

    </script>
</body>
</html>
